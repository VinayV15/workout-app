# Builds the app and publishes it to GitHub Pages on every push to main.
# GitHub Pages is free for public repositories, and for private repositories on
# any paid plan. If you keep the repo private on the free plan, use the Netlify
# or local options in the README instead.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Optional — set these as repository variables to bake the sync project
          # into the build. Leave them unset and sync is configured in-app instead.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      # Pages must already be enabled for the repository, with its source set to
      # "GitHub Actions" (Settings -> Pages). The `enablement: true` option looks
      # like it would remove that step, but the workflow's own token is not
      # permitted to create a Pages site, so it fails with "Resource not
      # accessible by integration".
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
